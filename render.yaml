services:
  - type: web
    name: fb-group-poster
    env: python
    buildCommand: pip install -r requirements.txt && npm ci --include=dev && npm run build && python -m playwright install chromium
    startCommand: python app.py
    disk:
      name: paste-happy-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
