services:
  - type: web
    name: pastehappy-python
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt && npm ci --include=dev && npm run build && python -m playwright install chromium
    startCommand: python app.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.3
      - key: NODE_VERSION
        value: 22.16.0
      - key: PLAYWRIGHT_HEADLESS
        value: true
      - key: DASHBOARD_PASSWORD
        generateValue: true
